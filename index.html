<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Wifey ❤️</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
color:black;
text-align:center;
}

/* Screens */
.screen{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.hidden{
display:none;
}

/* Buttons */
button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
position:absolute;
}

#yesBtn{
background:#28a745;
color:white;
left:55%;
}

#noBtn{
background:#dc3545;
color:white;
left:35%;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="kalyani.mp3" type="audio/mpeg">
</audio>

<!-- Opening -->
<div id="inbox" class="screen">
<h1>Wifey ❤️</h1>
<p>Click anywhere...</p>
</div>

<!-- Proposal -->
<div id="proposal" class="screen hidden">
<h1>Will you be my Valentine, Wifey? ❤️</h1>
<button id="noBtn">No</button>
<button id="yesBtn">Yes</button>
</div>

<!-- Final -->
<div id="final" class="screen hidden">
<h1>YOU SAID YES 💖</h1>
<p>I love you more than words can explain.</p>
</div>

<script>

/* ELEMENTS */
const inbox = document.getElementById("inbox");
const proposal = document.getElementById("proposal");
const finalScreen = document.getElementById("final");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const music = document.getElementById("bgMusic");

/* OPEN MAIL */
inbox.addEventListener("click", function(){
    music.play().catch(()=>{});
    inbox.classList.add("hidden");
    proposal.classList.remove("hidden");
});

/* NO BUTTON */
const messages = [
"No way 😏",
"Seriously?",
"Think again.",
"Wrong choice.",
"You sure?",
"Only Yes works ❤️"
];

let index = 0;

noBtn.addEventListener("mouseover", function(){
    noBtn.style.left = Math.random()*70 + "%";
    noBtn.style.top = Math.random()*300 + "px";
    alert(messages[index]);
    index = (index + 1) % messages.length;
});

/* YES BUTTON */
yesBtn.addEventListener("click", function(){
    proposal.classList.add("hidden");
    finalScreen.classList.remove("hidden");
});

</script>

</body>
</html>
